name: Archive Cache Unique

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Téléchargement du cache complet depuis Google Drive
        run: |
          echo "📥 Téléchargement des 55 Mo..."
          mkdir -p cache
          rclone sync gdrive:GOANGEL/cache ./cache --progress
          du -sh cache/

      - name: Création de l'archive unique
        run: |
          echo "📦 Compression en un seul fichier..."
          tar -czvf goangel_cache_complete.tar.gz cache/
          ls -lh goangel_cache_complete.tar.gz

      - name: Upload sur GitHub (Artefact Unique)
        uses: actions/upload-artifact@v4
        with:
          name: GOANGEL_CACHE_COMPLET
          path: goangel_cache_complete.tar.gz
          retention-days: 14

      - name: Création de la Release
        uses: softprops/action-gh-release@v1
        with:
          files: goangel_cache_complete.tar.gz
          name: "Cache GOANGEL - ${{ github.run_id }}"
          tag_name: "cache-v${{ github.run_id }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
