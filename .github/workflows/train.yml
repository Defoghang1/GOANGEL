        needs.finalize_copula.result == 'success' ||
        (inputs.force_stage == 'finalize_stacking' && needs.finalize_copula.result != 'failure')
      )
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: finalize_stacking
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  finalize_agg:
    name: "finalize_agg"
    needs: finalize_stacking
    if: |
      always() && !cancelled() &&
      (
        needs.finalize_stacking.result == 'success' ||
        (inputs.force_stage == 'finalize_agg' && needs.finalize_stacking.result != 'failure')
      )
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: finalize_agg
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  release:
    name: "release"
    needs: finalize_agg
    if: |
      always() && !cancelled() &&
      (needs.finalize_agg.result == 'success' || inputs.force_stage == 'release')
    uses: ./.github/workflows/release.yml
    with:
      version: ""
    secrets: inherit
