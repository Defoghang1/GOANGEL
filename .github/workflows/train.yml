name: GOANGEL Sequential

on:
  workflow_dispatch:
    inputs:
      seasons_lookback:
        default: "3"
        type: string
      enrich_xg:
        default: "true"
        type: string
      workers_per_key:
        default: "4"
        type: string
      max_workers:
        default: "256"
        type: string
      rate_limit_per_minute:
        default: "20"
        type: string
      max_attempts_per_model:
        default: "15"
        type: string
      force_stage:
        default: ""
        type: string
      is_retry:
        default: "false"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: goangel-sequential
  cancel-in-progress: true

jobs:

  prepare:
    name: "prepare"
    if: inputs.force_stage == '' || inputs.force_stage == 'prepare'
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: prepare
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  refresh:
    name: "refresh"
    needs: prepare
    if: |
      always() && !cancelled() &&
      (
        needs.prepare.result == 'success' ||
        (inputs.force_stage == 'refresh' && needs.prepare.result != 'failure')
      )
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: refresh
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_xgb:
    name: "train_xgb"
    needs: refresh
    if: |
      always() && !cancelled() &&
      (
        needs.refresh.result == 'success' ||
        (inputs.force_stage == 'train_xgb' && needs.refresh.result != 'failure')
      )
    uses: ./.github/workflows/_stage_runner.yml
    with:
      stage: train_xgb
      seasons_lookback: ${{ inputs.seasons_lookback }}
      enrich_xg: ${{ inputs.enrich_xg }}
      workers_per_key: ${{ inputs.workers_per_key }}
      max_workers: ${{ inputs.max_workers }}
      rate_limit_per_minute: ${{ inputs.rate_limit_per_minute }}
      max_attempts_per_model: ${{ inputs.max_attempts_per_model }}
      is_retry: ${{ inputs.is_retry }}
    secrets: inherit

  train_lgbm:
